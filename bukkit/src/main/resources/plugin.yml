name: ReportSystem
version: 2.0.0
main: de.interwebmedia.report.bukkit.ReportBukkitPlugin
api-version: '1.21'
commands:
  report:
    description: Erstellt einen Report
    usage: /report <spieler> [template] [text]
  reports:
    description: Moderations-Interface für Reports
    usage: /reports [resolve|reject|details|stats]
permissions:
  report.admin:
    description: Access to report administration
    default: op
